<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --ink: #12151a;
    --ink-soft: #5a6270;
    --line: #e4e7ec;
    --accent: #2f54ff;       
    --accent-soft: #eef1ff;
    --ios: #0a84ff;           
    --android: #34a853;
    --flutter: #02569b;
    --radius: 22px;           
    --font-display: 'Sora', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
    --font-mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  .hero { padding: 96px 0 72px; }

  .hero .eyebrow {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }

  .hero h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(44px, 8vw, 84px);
    letter-spacing: -0.03em;
    line-height: 1.02;
  }

  .hero .role {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(20px, 3vw, 28px);
    color: var(--ink-soft);
    margin-top: 14px;
  }

  .hero .role .dot { color: var(--accent); }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 36px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 12px 20px;
    border-radius: 100px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(18,21,26,0.08); border-color: #cdd3dd; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { box-shadow: 0 8px 20px rgba(47,84,255,0.35); }
  .btn svg { width: 18px; height: 18px; flex: none; }

  section { padding: 56px 0; }

  .section-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 32px;
  }
  .section-head h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  .section-head .count {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-soft);
  }

  .projects {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(18,21,26,0.08); }

  .card-top { display: flex; align-items: center; gap: 16px; }

  .app-icon {
    width: 60px;
    height: 60px;
    border-radius: var(--radius);
    flex: none;
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 24px;
    color: #fff;
    box-shadow: inset 0 -8px 16px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  .app-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title h3 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.01em;
  }

  .platforms { display: flex; gap: 6px; margin-top: 5px; }
  .platform {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 100px;
    color: #fff;
  }
  .platform.ios     { background: var(--ios); }
  .platform.android { background: var(--android); }
  .platform.flutter { background: var(--flutter); }
  .platform.other   { background: var(--ink-soft); }

  .card p { font-size: 14.5px; color: var(--ink-soft); flex: 1; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-family: var(--font-mono);
    font-size: 11.5px;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--accent-soft);
    color: var(--accent);
  }

  .card-link {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
    align-self: flex-start;
  }
  .card-link:hover { text-decoration: underline; }
  .card-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .contact {
    background: var(--ink);
    color: #fff;
    border-radius: 28px;
    padding: 56px 40px;
    text-align: center;
    margin-top: 64px;  
    margin-bottom: 72px;
  }
  .contact h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(26px, 4vw, 36px);
    letter-spacing: -0.02em;
  }
  .contact p { color: #aab2c0; margin: 12px 0 28px; }
  .contact .btn { border: none; }

  footer {
    padding: 0 0 40px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  @media (max-width: 560px) {
    .hero { padding: 64px 0 48px; }
    .contact { padding: 44px 24px; }
  }
</style>
</head>

<script>
(function () {
  document.getElementById("year").textContent = new Date().getFullYear();

  if (!CONFIG.showPortfolio || CONFIG.projects.length === 0) return;

  const section = document.getElementById("portfolio");
  const grid = document.getElementById("projects-grid");
  section.hidden = false;
  document.getElementById("project-count").textContent =
    CONFIG.projects.length + (CONFIG.projects.length === 1 ? " project" : " projects");

  const PLATFORM_CLASS = { ios: "ios", android: "android", flutter: "flutter" };

  for (const p of CONFIG.projects) {
    const card = document.createElement("article");
    card.className = "card";

    // Icon
    const top = document.createElement("div");
    top.className = "card-top";
    const icon = document.createElement("div");
    icon.className = "app-icon";
    if (p.iconUrl) {
      const img = document.createElement("img");
      img.src = p.iconUrl;
      img.alt = p.name + " app icon";
      img.loading = "lazy";
      img.onerror = () => {
        icon.removeChild(img);
        icon.style.background = p.color || "var(--accent)";
        icon.textContent = p.initials || (p.name || "?").charAt(0);
      };
      icon.appendChild(img);
    } else {
      icon.style.background = p.color || "var(--accent)";
      icon.textContent = p.initials || (p.name || "?").charAt(0);
    }
    top.appendChild(icon);

    const title = document.createElement("div");
    title.className = "card-title";
    const h3 = document.createElement("h3");
    h3.textContent = p.name;
    title.appendChild(h3);
    if (p.platforms && p.platforms.length) {
      const row = document.createElement("div");
      row.className = "platforms";
      for (const pl of p.platforms) {
        const badge = document.createElement("span");
        badge.className = "platform " + (PLATFORM_CLASS[pl.toLowerCase()] || "other");
        badge.textContent = pl;
        row.appendChild(badge);
      }
      title.appendChild(row);
    }
    top.appendChild(title);
    card.appendChild(top);

    if (p.description) {
      const desc = document.createElement("p");
      desc.textContent = p.description;
      card.appendChild(desc);
    }

    if (p.tags && p.tags.length) {
      const tags = document.createElement("div");
      tags.className = "tags";
      for (const t of p.tags) {
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = t;
        tags.appendChild(tag);
      }
      card.appendChild(tags);
    }

    if (p.link) {
      const a = document.createElement("a");
      a.className = "card-link";
      a.href = p.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = p.linkLabel || "View project →";
      card.appendChild(a);
    }

    grid.appendChild(card);
  }
})();
</script>
